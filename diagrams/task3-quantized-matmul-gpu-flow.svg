<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 760" width="980" height="760">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .title { font-size: 20px; font-weight: 600; fill: #111827; }
    .label { font-size: 14px; font-weight: 600; fill: #111827; }
    .sub { font-size: 12px; fill: #6b7280; }
    .box { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; rx: 8; ry: 8; }
    .py { fill: #eff6ff; stroke: #bfdbfe; }
    .cpp { fill: #f0fdf4; stroke: #bbf7d0; }
    .metal { fill: #faf5ff; stroke: #e9d5ff; }
    .data { fill: #f0fdfa; stroke: #99f6e4; }
    .gpu { fill: #fff7ed; stroke: #fed7aa; }
    .arrow-main { stroke: #2563eb; stroke-width: 2; fill: none; marker-end: url(#arrow-blue); }
    .arrow-data { stroke: #16a34a; stroke-width: 2; fill: none; marker-end: url(#arrow-green); }
    .arrow-gpu { stroke: #9333ea; stroke-width: 2; fill: none; marker-end: url(#arrow-purple); }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/>
    </marker>
  </defs>

  <rect width="980" height="760" fill="#ffffff"/>
  <text x="40" y="42" class="title">Task3: GPU Quantized Matmul Flow</text>
  <text x="40" y="66" class="sub">目标: 在 GPU stream 下用 Metal kernel 并行计算 C = A @ dequantize(B)^T</text>

  <rect x="40" y="100" width="220" height="82" class="box py"/>
  <text x="64" y="130" class="label">Python 调用</text>
  <text x="64" y="154" class="sub">with mx.stream(mx.gpu)</text>
  <text x="64" y="170" class="sub">quantized_linear / quantized_matmul</text>

  <rect x="330" y="100" width="250" height="82" class="box cpp"/>
  <text x="354" y="130" class="label">同一个 C++ Primitive</text>
  <text x="354" y="154" class="sub">tiny_llm_ext::quantized_matmul</text>
  <text x="354" y="170" class="sub">返回 lazy mx::array, shape (M,K)</text>

  <rect x="660" y="100" width="250" height="82" class="box cpp"/>
  <text x="684" y="130" class="label">MLX GPU evaluate</text>
  <text x="684" y="154" class="sub">GPU stream 触发 eval_gpu</text>
  <text x="684" y="170" class="sub">QuantizedMatmul::eval_gpu</text>

  <path d="M260 141 L330 141" class="arrow-main"/>
  <path d="M580 141 L660 141" class="arrow-main"/>

  <rect x="660" y="235" width="250" height="112" class="box cpp"/>
  <text x="684" y="265" class="label">C++ GPU Dispatch</text>
  <text x="684" y="289" class="sub">检查 row contiguous</text>
  <text x="684" y="305" class="sub">分配 out buffer</text>
  <text x="684" y="321" class="sub">加载 tiny_llm_ext metallib</text>
  <text x="684" y="337" class="sub">获取 quantized_matmul_w4a16_g128_bf16</text>

  <path d="M785 182 L785 235" class="arrow-main"/>

  <rect x="355" y="235" width="245" height="112" class="box data"/>
  <text x="379" y="265" class="label">绑定 Metal Buffers</text>
  <text x="379" y="289" class="sub">0: scales, 1: biases</text>
  <text x="379" y="305" class="sub">2: A, 3: packed B</text>
  <text x="379" y="321" class="sub">4: output C</text>
  <text x="379" y="337" class="sub">5/6/7: M,N,K</text>

  <path d="M660 291 L600 291" class="arrow-data"/>

  <rect x="40" y="235" width="245" height="112" class="box gpu"/>
  <text x="64" y="265" class="label">配置二维线程网格</text>
  <text x="64" y="289" class="sub">x 维覆盖 M rows</text>
  <text x="64" y="305" class="sub">y 维覆盖 K output features</text>
  <text x="64" y="321" class="sub">threads_per_group = (32, y_size)</text>
  <text x="64" y="337" class="sub">dispatch_threadgroups(...)</text>

  <path d="M355 291 L285 291" class="arrow-gpu"/>

  <rect x="40" y="410" width="245" height="102" class="box metal"/>
  <text x="64" y="440" class="label">Metal Kernel 启动</text>
  <text x="64" y="464" class="sub">每个 thread 计算一个 C[i,k]</text>
  <text x="64" y="480" class="sub">i = grid x 坐标</text>
  <text x="64" y="496" class="sub">k = grid y 坐标</text>

  <path d="M162 347 L162 410" class="arrow-gpu"/>

  <rect x="355" y="410" width="245" height="102" class="box metal"/>
  <text x="379" y="440" class="label">线程内遍历 N 维</text>
  <text x="379" y="464" class="sub">for group in N / 128</text>
  <text x="379" y="480" class="sub">scale = scales[k, group]</text>
  <text x="379" y="496" class="sub">bias = biases[k, group]</text>

  <path d="M285 461 L355 461" class="arrow-gpu"/>

  <rect x="660" y="410" width="250" height="102" class="box metal"/>
  <text x="684" y="440" class="label">unpack packed int4</text>
  <text x="684" y="464" class="sub">uint32 -> 8 个 int4</text>
  <text x="684" y="480" class="sub">q = (packed >> shift) &amp; 0xF</text>
  <text x="684" y="496" class="sub">手动展开 8 次乘加</text>

  <path d="M600 461 L660 461" class="arrow-data"/>

  <rect x="660" y="585" width="250" height="102" class="box metal"/>
  <text x="684" y="615" class="label">反量化 + 累加</text>
  <text x="684" y="639" class="sub">b_val = q * scale + bias</text>
  <text x="684" y="655" class="sub">sum += A[i,j] * b_val</text>
  <text x="684" y="671" class="sub">float32 accumulator</text>

  <path d="M785 512 L785 585" class="arrow-data"/>

  <rect x="355" y="585" width="245" height="102" class="box gpu"/>
  <text x="379" y="615" class="label">写回 GPU 输出</text>
  <text x="379" y="639" class="sub">C[i,k] = bf16(sum)</text>
  <text x="379" y="655" class="sub">out[i * K + k]</text>
  <text x="379" y="671" class="sub">输出 shape: (M,K)</text>

  <path d="M660 636 L600 636" class="arrow-data"/>

  <rect x="40" y="585" width="245" height="102" class="box py"/>
  <text x="64" y="615" class="label">Python 获得结果</text>
  <text x="64" y="639" class="sub">mx.eval(out) 完成</text>
  <text x="64" y="655" class="sub">quantized_linear reshape 回 (...,K)</text>
  <text x="64" y="671" class="sub">继续模型 forward</text>

  <path d="M355 636 L285 636" class="arrow-main"/>

  <g transform="translate(40, 728)">
    <line x1="0" y1="0" x2="28" y2="0" class="arrow-main"/>
    <text x="38" y="4" class="sub">调用 / 返回</text>
    <line x1="150" y1="0" x2="178" y2="0" class="arrow-data"/>
    <text x="188" y="4" class="sub">buffer / 数据</text>
    <line x1="310" y1="0" x2="338" y2="0" class="arrow-gpu"/>
    <text x="348" y="4" class="sub">GPU dispatch / 并行</text>
  </g>
</svg>
