<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .title { font-size: 20px; font-weight: 600; fill: #111827; }
    .label { font-size: 14px; font-weight: 600; fill: #111827; }
    .sub { font-size: 12px; fill: #6b7280; }
    .box { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; rx: 8; ry: 8; }
    .py { fill: #eff6ff; stroke: #bfdbfe; }
    .cpp { fill: #f0fdf4; stroke: #bbf7d0; }
    .cpu { fill: #fff7ed; stroke: #fed7aa; }
    .data { fill: #f0fdfa; stroke: #99f6e4; }
    .check { fill: #faf5ff; stroke: #e9d5ff; }
    .arrow-main { stroke: #2563eb; stroke-width: 2; fill: none; marker-end: url(#arrow-blue); }
    .arrow-data { stroke: #16a34a; stroke-width: 2; fill: none; marker-end: url(#arrow-green); }
    .arrow-loop { stroke: #9333ea; stroke-width: 1.8; fill: none; marker-end: url(#arrow-purple); }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/>
    </marker>
  </defs>

  <rect width="960" height="720" fill="#ffffff"/>
  <text x="40" y="42" class="title">Task2: CPU Quantized Matmul Flow</text>
  <text x="40" y="66" class="sub">目标: C = A @ dequantize(B)^T, 其中 B 是 uint32 packed int4 权重</text>

  <rect x="40" y="100" width="210" height="80" class="box py"/>
  <text x="64" y="130" class="label">Python 调用</text>
  <text x="64" y="154" class="sub">quantized_linear(x, w)</text>
  <text x="64" y="170" class="sub">flatten: (..., N) -> (M, N)</text>

  <rect x="320" y="100" width="250" height="80" class="box py"/>
  <text x="344" y="130" class="label">Python wrapper</text>
  <text x="344" y="154" class="sub">quantized_matmul(scales, biases, a, b)</text>
  <text x="344" y="170" class="sub">优先调用 tiny_llm_ext</text>

  <rect x="650" y="100" width="240" height="80" class="box cpp"/>
  <text x="674" y="130" class="label">C++ binding</text>
  <text x="674" y="154" class="sub">nanobind 暴露 quantized_matmul</text>
  <text x="674" y="170" class="sub">进入 tiny_llm_ext::quantized_matmul</text>

  <path d="M250 140 L320 140" class="arrow-main"/>
  <path d="M570 140 L650 140" class="arrow-main"/>

  <rect x="650" y="235" width="240" height="110" class="box check"/>
  <text x="674" y="265" class="label">参数校验</text>
  <text x="674" y="289" class="sub">dtype: bf16 / uint32</text>
  <text x="674" y="305" class="sub">bits = 4, group_size = 128</text>
  <text x="674" y="321" class="sub">a,b 必须 2D</text>
  <text x="674" y="337" class="sub">transpose_b 必须 true</text>

  <path d="M770 180 L770 235" class="arrow-main"/>

  <rect x="360" y="235" width="230" height="110" class="box cpp"/>
  <text x="384" y="265" class="label">创建 lazy mx::array</text>
  <text x="384" y="289" class="sub">输出 shape: (M, K)</text>
  <text x="384" y="305" class="sub">primitive: QuantizedMatmul</text>
  <text x="384" y="321" class="sub">inputs: scales,biases,a,b</text>

  <path d="M650 290 L590 290" class="arrow-main"/>

  <rect x="70" y="235" width="220" height="110" class="box cpp"/>
  <text x="94" y="265" class="label">MLX evaluate</text>
  <text x="94" y="289" class="sub">mx.eval(out) 或依赖触发</text>
  <text x="94" y="305" class="sub">CPU stream -> eval_cpu</text>
  <text x="94" y="321" class="sub">调用 quantized_matmul_impl</text>

  <path d="M360 290 L290 290" class="arrow-main"/>

  <rect x="70" y="410" width="220" height="95" class="box cpu"/>
  <text x="94" y="440" class="label">CPU encoder</text>
  <text x="94" y="464" class="sub">分配 out buffer</text>
  <text x="94" y="480" class="sub">注册 input/output arrays</text>
  <text x="94" y="496" class="sub">dispatch CPU lambda</text>

  <path d="M180 345 L180 410" class="arrow-main"/>

  <rect x="360" y="410" width="230" height="95" class="box cpu"/>
  <text x="384" y="440" class="label">遍历输出元素</text>
  <text x="384" y="464" class="sub">for i in M</text>
  <text x="384" y="480" class="sub">for k in K</text>
  <text x="384" y="496" class="sub">float sum = 0</text>

  <path d="M290 458 L360 458" class="arrow-main"/>

  <rect x="650" y="410" width="240" height="95" class="box data"/>
  <text x="674" y="440" class="label">按 group 读取参数</text>
  <text x="674" y="464" class="sub">group_idx: 0..N/128-1</text>
  <text x="674" y="480" class="sub">scale = scales[k, group]</text>
  <text x="674" y="496" class="sub">bias = biases[k, group]</text>

  <path d="M590 458 L650 458" class="arrow-data"/>

  <rect x="650" y="560" width="240" height="95" class="box data"/>
  <text x="674" y="590" class="label">unpack + 反量化</text>
  <text x="674" y="614" class="sub">packed uint32 -> 8 个 int4</text>
  <text x="674" y="630" class="sub">q = (packed >> offset) &amp; 0xF</text>
  <text x="674" y="646" class="sub">b_val = q * scale + bias</text>

  <path d="M770 505 L770 560" class="arrow-data"/>

  <rect x="360" y="560" width="230" height="95" class="box cpu"/>
  <text x="384" y="590" class="label">乘加累加</text>
  <text x="384" y="614" class="sub">sum += A[i,j] * b_val</text>
  <text x="384" y="630" class="sub">float32 accumulator</text>
  <text x="384" y="646" class="sub">遍历完 N 维</text>

  <path d="M650 608 L590 608" class="arrow-data"/>
  <path d="M475 560 C475 535, 520 535, 520 505" class="arrow-loop"/>

  <rect x="70" y="560" width="220" height="95" class="box cpp"/>
  <text x="94" y="590" class="label">写回输出</text>
  <text x="94" y="614" class="sub">out[i,k] = bf16(sum)</text>
  <text x="94" y="630" class="sub">得到 C: (M, K)</text>
  <text x="94" y="646" class="sub">返回 Python / 上层模型</text>

  <path d="M360 608 L290 608" class="arrow-main"/>

  <g transform="translate(40, 690)">
    <line x1="0" y1="0" x2="28" y2="0" class="arrow-main"/>
    <text x="38" y="4" class="sub">调用 / 执行控制</text>
    <line x1="180" y1="0" x2="208" y2="0" class="arrow-data"/>
    <text x="218" y="4" class="sub">数据计算路径</text>
    <line x1="360" y1="0" x2="388" y2="0" class="arrow-loop"/>
    <text x="398" y="4" class="sub">循环</text>
  </g>
</svg>
